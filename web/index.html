<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fieldline: a field service app demo for technicians, built with Flutter. Jobs, route, checklists, parts, photos, signature, invoice and offline sync.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fieldline">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fieldline · Field service app demo</title>
  <link rel="manifest" href="manifest.json">
<style>
    html, body { margin: 0; height: 100%; background: #fbfbfc; }
    @media (prefers-color-scheme: dark) { html, body { background: #0c0d0f; } }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; }
    #boot div { width: 44px; height: 44px; border-radius: 11px; background: #5b5bd6; animation: boot 1.2s ease-in-out infinite; }
    @keyframes boot { 50% { opacity: .55; transform: scale(.94); } }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading Fieldline"><div></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>window.addEventListener("flutter-first-frame", () => document.getElementById("boot")?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
